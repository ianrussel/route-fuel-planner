[flake8]
max-line-length = 100
extend-ignore =
    # line too long (black handles formatting)
    E501
exclude =
    .git,
    .venv,
    __pycache__,
    migrations,
    .env

[tool:black]
line-length = 100

[isort]
profile = black
line_length = 100
known_django = django
known_third_party = rest_framework,requests,geopy,dotenv,dj_database_url
known_first_party = routes,spotterai
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
